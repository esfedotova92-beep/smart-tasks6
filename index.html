<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Деление на команды</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .content {
            padding: 40px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        select {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .team-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .team-name {
            font-size: 1.3em;
            font-weight: bold;
        }

        .team-count {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .team-members {
            list-style: none;
        }

        .team-members li {
            padding: 8px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .team-members li:before {
            content: "•";
            color: #667eea;
            font-weight: bold;
            margin-right: 10px;
        }

        .color-1 { border-left: 5px solid #FF6B6B; }
        .color-2 { border-left: 5px solid #4ECDC4; }
        .color-3 { border-left: 5px solid #FFD93D; }
        .color-4 { border-left: 5px solid #6C5CE7; }

        .stats {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Деление на команды</h1>
            <p>Быстро и случайно распределите участников</p>
        </div>

        <div class="content">
            <label><b>Введите имена (каждое с новой строки):</b></label>
            <textarea id="names" placeholder="Иван&#10;Мария&#10;Алексей"></textarea>

            <div class="controls">
                <select id="teamCount">
                    <option value="2">2 команды</option>
                    <option value="3" selected>3 команды</option>
                    <option value="4">4 команды</option>
                </select>
                <button class="btn-primary" onclick="distribute()">🎲 Распределить</button>
                <button onclick="clearAll()" style="background:#f0f0f0;">🗑️ Очистить</button>
            </div>

            <div id="stats" class="stats hidden">
                <div><div class="stat-value" id="total">0</div><div>Участников</div></div>
                <div><div class="stat-value" id="teams">0</div><div>Команд</div></div>
            </div>

            <div id="results" class="results"></div>
        </div>
    </div>

    <script>
        function distribute() {
            const names = document.getElementById('names').value
                .split('\n')
                .map(n => n.trim())
                .filter(n => n.length > 0);
            
            const count = parseInt(document.getElementById('teamCount').value);
            
            if (names.length === 0) {
                alert('Введите имена участников');
                return;
            }

            // Перемешиваем
            for (let i = names.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [names[i], names[j]] = [names[j], names[i]];
            }

            // Создаем команды
            const teams = Array.from({length: count}, () => []);
            names.forEach((name, i) => teams[i % count].push(name));

            // Отображаем
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            
            document.getElementById('stats').classList.remove('hidden');
            document.getElementById('total').textContent = names.length;
            document.getElementById('teams').textContent = count;

            teams.forEach((team, idx) => {
                const card = document.createElement('div');
                card.className = `team-card color-${idx + 1}`;
                card.innerHTML = `
                    <div class="team-header">
                        <div class="team-name">Команда ${idx + 1}</div>
                        <div class="team-count">${team.length} чел.</div>
                    </div>
                    <ul class="team-members">
                        ${team.map(m => `<li>${m}</li>`).join('')}
                    </ul>
                `;
                resultsDiv.appendChild(card);
            });
        }

        function clearAll() {
            document.getElementById('names').value = '';
            document.getElementById('results').innerHTML = '';
            document.getElementById('stats').classList.add('hidden');
        }
    </script>
</body>
</html>
